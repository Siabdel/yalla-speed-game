<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>race-perf — Three.js</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font:14px system-ui,sans-serif;background:#87ceeb}
canvas{display:block}
#hud{position:fixed;top:8px;left:8px;background:#000a;color:#fff;padding:8px 12px;border-radius:8px;font-family:monospace;white-space:pre;max-width:95vw}
#ctl{position:fixed;bottom:8px;left:8px;background:#fffd;padding:8px;border-radius:8px;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
#ctl button,#ctl select{min-height:40px;font:inherit}
</style></head>
<body>
<div id="hud">…</div>
<div id="ctl">
  <label>Cubes <select id="count"><option>200</option><option>1000</option><option>5000</option></select></label>
  <label>Ombres <select id="shadow"><option value="0">non</option><option value="1">oui</option></select></label>
  <label>Pixel ratio <select id="pr"><option value="1">1</option><option value="2">2 (écran natif)</option><option value="0.75">0.75</option></select></label>
  <label>Mode <select id="inst"><option value="0">200 meshes séparés</option><option value="1">InstancedMesh</option></select></label>
</div>
<script type="module" src="./main.js"></script>
</body></html>
